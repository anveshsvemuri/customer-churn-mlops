[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "customer-churn-mlops"
version = "0.1.0"
description = "Reproducible telecom churn training, inference, and monitoring reference platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
churn-mlops = "churn_mlops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/churn_mlops"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

